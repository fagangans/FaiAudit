# =====================================================================
# Nginx reverse proxy untuk FaiAudit — TLS + rate-limit lapisan jaringan
# =====================================================================
# Tujuan:
#   1. Menutup celah PLAINTEXT HTTP: saat ini dashboard dilayani lewat
#      http://IP:3002 sehingga password & bearer token login dikirim
#      TELANJANG di jaringan. Proxy ini menambah TLS (https://) di depan.
#   2. Membatasi banjir request (DDoS application-layer) SEBELUM sampai ke
#      Node.js — Node tidak lagi diekspos langsung ke internet.
#
# CATATAN PENTING (VPS ini berbagi dengan wabot & webchat-backend):
#   - File ini HANYA menangani domain FaiAudit (server_name di bawah).
#     Tidak menyentuh/menimpa config Nginx untuk app lain.
#   - Pasang sebagai file TERPISAH di /etc/nginx/sites-available/faiaudit
#     lalu symlink ke sites-enabled — JANGAN edit config app lain.
#   - Node FaiAudit tetap listen di 127.0.0.1:3002 (localhost saja),
#     port 3002 ditutup dari internet via firewall (lihat HARDENING.md).
#
# Ganti `faiaudit.domain-kamu.com` dengan domain asli yang sudah
# diarahkan (A record) ke IP VPS 43.129.55.131.
# =====================================================================

# Zona rate-limit (didefinisikan di http{} — taruh baris limit_req_zone &
# limit_conn_zone ini di dalam /etc/nginx/nginx.conf bagian http{}, BUKAN
# di dalam server{} di bawah). Diletakkan di sini sebagai referensi:
#
#   limit_req_zone  $binary_remote_addr zone=faiaudit_req:10m rate=10r/s;
#   limit_conn_zone $binary_remote_addr zone=faiaudit_conn:10m;

# --- Redirect semua HTTP ke HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name faiaudit.domain-kamu.com;

    # Biarkan path verifikasi Certbot tetap lewat HTTP saat perpanjangan cert.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Server HTTPS utama ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name faiaudit.domain-kamu.com;

    # Sertifikat diisi otomatis oleh `certbot --nginx` (lihat HARDENING.md).
    ssl_certificate     /etc/letsencrypt/live/faiaudit.domain-kamu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/faiaudit.domain-kamu.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Batas ukuran body (selaras dengan express.json limit 1mb di app).
    client_max_body_size 2m;

    # Batas jumlah koneksi simultan per-IP — meredam slow-loris / connection
    # flooding (DDoS lapisan jaringan) sebelum menyentuh Node.
    limit_conn faiaudit_conn 20;

    # Header keamanan dasar (helmet di app juga memasang, ini lapisan kedua).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        # Rate-limit: 10 req/detik/IP, izinkan burst 20 (antri, tidak langsung
        # tolak) supaya pemakaian normal dashboard tidak ikut kena.
        limit_req zone=faiaudit_req burst=20 nodelay;

        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;

        # Teruskan IP klien ASLI ke Node supaya rate-limit express-rate-limit
        # (TRUST_PROXY=1) memakai IP benar, bukan IP proxy. Tanpa ini semua
        # request terlihat berasal dari 127.0.0.1 dan rate-limit jadi salah.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }
}
